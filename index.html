<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C86A3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tsena Mandroso">
<meta name="description" content="Caisse et facturation du resto-snack Tsena Mandroso">
<title>Tsena Mandroso — Caisse</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#E4D8C4;font:500 14px/1.5 system-ui,-apple-system,sans-serif;color:#2A1D14}
iframe{display:block;border:0;width:100%;height:100%}
#bar{position:fixed;left:12px;right:12px;bottom:12px;display:none;align-items:center;gap:10px;background:#2A1D14;color:#F6F0E5;border-radius:14px;padding:11px 12px;box-shadow:0 12px 30px -10px rgba(42,29,20,0.6);z-index:9}
#bar b{font-size:13px;font-weight:600}
#bar span{font-size:11.5px;opacity:0.7;display:block}
#bar button{border:0;border-radius:10px;padding:10px 14px;font:700 13px system-ui,sans-serif;cursor:pointer}
#go{background:#C86A3E;color:#FFF6EE}
#no{background:rgba(246,240,229,0.14);color:#F6F0E5}
</style>
</head>
<body>
<iframe src="./app.html" title="Caisse Tsena Mandroso" allow="fullscreen"></iframe>
<div id="bar">
  <div style="flex:1;min-width:0"><b>Installer l’application</b><span>Icône sur l’écran d’accueil, utilisable hors ligne</span></div>
  <button id="go" type="button">Installer</button>
  <button id="no" type="button">Plus tard</button>
</div>
<script>
(function () {
  var bar = document.getElementById('bar'), prompt = null;
  function hide() { bar.style.display = 'none'; }
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    prompt = e;
    if (!localStorage.getItem('tm_install_off')) bar.style.display = 'flex';
  });
  document.getElementById('go').addEventListener('click', function () {
    if (!prompt) return hide();
    prompt.prompt();
    prompt.userChoice.then(hide);
  });
  document.getElementById('no').addEventListener('click', function () {
    try { localStorage.setItem('tm_install_off', '1'); } catch (e) {}
    hide();
  });
  window.addEventListener('appinstalled', hide);
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
